name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix: 
        os: [ubuntu-latest, windows-latest, macOS-latest]
    permissions:
      contents: read

    steps:
    # 1. Pull the code down ONCE at the start
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Java Environment
    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'

    # 3. Cache and configure Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Execute the build (Now works seamlessly across Ubuntu, Windows, and macOS)
    - name: Run ./gradlew build
      run: ./gradlew build
